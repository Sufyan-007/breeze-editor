components:
  schemas:
    AppConfigDetails:
      properties:
        author:
          type: string
        defaultComponent:
          type: string
        dependencies:
          items:
            $ref: '#/components/schemas/DependencyObject'
          type: array
        description:
          type: string
        name:
          type: string
        path:
          type: string
      type: object
    CommentDetails:
      properties:
        body:
          description: body of post
          type: string
        id:
          description: id of post
          type: number
        title:
          description: title of post
          type: string
        userId:
          description: id of user
          type: number
      type: object
    CreatePostResponse:
      description: Represents a chat completion response returned by model, based
        on the provided input.
      properties:
        id:
          description: id of post.
          type: number
      type: object
    DependencyObject:
      properties:
        name:
          description: name of dependency
          type: string
        value:
          description: value of dependency
          type: string
      type: object
    Error:
      properties:
        code:
          nullable: true
          type: string
        message:
          nullable: false
          type: string
        param:
          nullable: true
          type: string
        type:
          nullable: false
          type: string
      required:
      - type
      - message
      - param
      - code
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
      type: object
    ListCommntsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CommentDetails'
          type: array
      type: object
    ListPostsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/PostDetails'
          type: array
      type: object
    PostDetails:
      properties:
        body:
          description: body of post
          type: string
        id:
          description: id of post
          type: number
        title:
          description: title of post
          type: string
        userId:
          description: id of user
          type: number
      required:
      - id
      - userId
      type: object
  securitySchemes:
    ApiKeyAuth:
      scheme: bearer
      type: http
info:
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  description: The OpenAI REST API. Please see https://platform.openai.com/docs/api-reference
    for more details.
  license:
    name: MIT
    url: https://github.com/openai/openai-openapi/blob/master/LICENSE
  termsOfService: https://openai.com/policies/terms-of-use
  title: OpenAI API
  version: 2.0.0
openapi: 3.0.0
paths:
  /breeze/config-writer/:
    post:
      operationId: saveAppConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppConfigDetails'
        required: true
      summary: Crete basic app config.
      tags:
      - Config
  /comments:
    get:
      operationId: getComments
      parameters:
      - description: Only return comments with the given post.
        in: query
        name: postId
        required: false
        schema:
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCommntsResponse'
          description: OK
      summary: Returns a list of comments that belong to the user's post.
      tags:
      - Comment
  /posts:
    get:
      operationId: getPosts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPostsResponse'
          description: OK
      summary: Returns a list of posts that belong to the user's organization.
      tags:
      - Post
    post:
      operationId: createPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDetails'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetails'
          description: OK
      summary: Creates a post response for the given  conversation.
      tags:
      - Post
  /posts/{postId}:
    get:
      operationId: getPost
      parameters:
      - description: The ID of the post to use for this request
        in: path
        name: postId
        required: true
        schema:
          example: 1
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetails'
          description: OK
      summary: Returns a post that belong to the user's organization.
      tags:
      - Post
servers:
- url: http://localhost:8080
tags:
- description: Sample posts.
  name: Post
- description: Comments from posts.
  name: Comment
- description: Comments from posts.
  name: Config
